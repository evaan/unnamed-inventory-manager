name: Deliver

# Delivers main to production:
#   1. re-run the backend and frontend checks on the merged commit
#   2. build both images once and publish them to GHCR, tagged with the commit SHA
#   3. deploy that exact SHA on the production host (self-hosted runner),
#      check it is healthy, and roll back to the previous release if it is not.
#
# Run it by hand with "rollback_to" set to an earlier commit SHA to redeploy that
# release without rebuilding it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Commit SHA of an earlier release to redeploy. Leave empty to build and deploy main."
        required: false
        default: ""

concurrency:
  group: deliver-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/evaan/unnamed-inventory-manager

jobs:
  backend:
    if: ${{ !inputs.rollback_to }}
    uses: ./.github/workflows/backend.yml

  frontend:
    if: ${{ !inputs.rollback_to }}
    uses: ./.github/workflows/frontend.yml

  publish:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          build-args: VITE_API_URL=/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.rollback_to)) }}
    runs-on: [self-hosted, inventory-prod]
    environment:
      name: production
      url: https://inventory.evaan.dev
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash # -eo pipefail, so a failing command before "| tee" fails the step
    env:
      TARGET: ${{ inputs.rollback_to || github.sha }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Check host configuration
        run: |
          if [ -z "$DEPLOY_DIR" ] || [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::Set the DEPLOY_DIR repository variable to the folder on the host that holds compose.yml and .env"
            exit 1
          fi

      - name: Record the running release
        id: previous
        run: |
          cd "$DEPLOY_DIR"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Back up the database
        run: |
          cd "$DEPLOY_DIR"
          mkdir -p backups
          if docker compose ps --status running --services | grep -qx postgres; then
            file="backups/pre-deploy-$(date +%F-%H%M)-${TARGET:0:7}.sql.gz"
            docker compose exec -T postgres pg_dump -U admin inventory | gzip > "$file"
            echo "Saved $file"
          else
            echo "postgres is not running; nothing to back up"
          fi
          # keep the 14 newest backups
          { ls -1t backups/*.sql.gz 2>/dev/null || true; } | tail -n +15 | xargs -r rm --

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy ${{ env.TARGET }}
        run: |
          cd "$DEPLOY_DIR"
          git fetch --quiet origin
          git checkout --quiet --detach "$TARGET"
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TARGET/" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$TARGET" >> .env
          fi
          docker compose pull backend frontend
          docker compose up -d --no-build --remove-orphans

      - name: Health check
        run: |
          cd "$DEPLOY_DIR"
          COMMIT="${TARGET:0:7}" scripts/healthcheck.sh http://localhost:8381 12 | tee "$RUNNER_TEMP/healthcheck.txt"
          {
            echo
            echo "docker compose ps"
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          } | tee -a "$RUNNER_TEMP/healthcheck.txt"
          {
            echo "### Deployed \`${TARGET:0:7}\` to production"
            echo '```'
            cat "$RUNNER_TEMP/healthcheck.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ env.TARGET }}
          path: ${{ runner.temp }}/healthcheck.txt
          if-no-files-found: ignore

      - name: Roll back to the previous release
        if: ${{ failure() && steps.previous.outcome == 'success' }}
        env:
          PREV_COMMIT: ${{ steps.previous.outputs.commit }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          cd "$DEPLOY_DIR"
          echo "::warning::Deploy of ${TARGET:0:7} failed; rolling back to ${PREV_COMMIT:0:7}"
          git checkout --quiet --detach "$PREV_COMMIT"
          if [ -n "$PREV_TAG" ]; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREV_TAG/" .env
            docker compose pull backend frontend
            docker compose up -d --no-build --remove-orphans
          else
            # the previous release was built on the host, before images were published
            sed -i '/^IMAGE_TAG=/d' .env
            docker compose up -d --build --remove-orphans
          fi
          docker compose ps

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
