name: inventory

services:
  traefik:
    image: traefik:v3
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.network=inventory_default
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `inventory`)
      - --entrypoints.web.address=:80
    ports:
      - "8381:80"
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-api

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:lts
    restart: always
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  frontend:
    image: sdh-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: Host(`inventory.evaan.dev`) || Host(`localhost`)
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.services.frontend.loadbalancer.server.port: "8080"

  backend:
    image: sdh-backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GIN_MODE: release
      TZ: ${TZ:-America/St_Johns}
      POSTGRES_URL: postgresql://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/inventory?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://inventory.evaan.dev/api/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://inventory.evaan.dev/app}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    labels:
      traefik.enable: "true"
      traefik.http.routers.backend.rule: (Host(`inventory.evaan.dev`) || Host(`localhost`)) && (Path(`/api`) || PathPrefix(`/api/`))
      traefik.http.routers.backend.entrypoints: web
      traefik.http.routers.backend.priority: "100"
      traefik.http.routers.backend.middlewares: api-strip-prefix
      traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes: /api
      traefik.http.services.backend.loadbalancer.server.port: "8080"

  postgres:
    image: postgres:19-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inventory
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  docker-api:
    internal: true
