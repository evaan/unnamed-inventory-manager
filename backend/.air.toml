root = "."
tmp_dir = "/tmp/inventory-air"

[build]
  cmd = "go build -o /tmp/inventory-air/server ."
  bin = "/tmp/inventory-air/server"
  delay = 500
  include_ext = ["go", "mod", "sum", "html", "tpl", "tmpl"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ['_test\.go$']
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true
