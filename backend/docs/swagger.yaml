basePath: /
definitions:
  auth.PatchUserRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  auth.PutPermissionsRequest:
    properties:
      permissions:
        items:
          type: string
        type: array
    required:
    - permissions
    type: object
  bookings.BookingDTO:
    properties:
      end:
        type: string
      equipmentID:
        type: integer
      id:
        type: integer
      mine:
        type: boolean
      purpose:
        type: string
      start:
        type: string
      userName:
        type: string
    type: object
  bookings.BookingReq:
    properties:
      End:
        type: string
      EquipmentID:
        type: integer
      Purpose:
        type: string
      Start:
        type: string
    required:
    - End
    - EquipmentID
    - Start
    type: object
  bookings.Equipment:
    properties:
      category:
        type: string
      closeHour:
        description: local hour the equipment closes, 1-24
        type: integer
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      location:
        type: string
      maintenanceNote:
        type: string
      name:
        type: string
      openHour:
        description: local hour the equipment opens, 0-23
        type: integer
      status:
        $ref: '#/definitions/bookings.EquipmentStatus'
    type: object
  bookings.EquipmentReq:
    properties:
      Category:
        type: string
      CloseHour:
        type: integer
      Description:
        type: string
      Icon:
        type: string
      Location:
        type: string
      MaintenanceNote:
        type: string
      Name:
        type: string
      OpenHour:
        type: integer
      Status:
        $ref: '#/definitions/bookings.EquipmentStatus'
    required:
    - Category
    - Location
    - Name
    - Status
    type: object
  bookings.EquipmentStatus:
    enum:
    - ACTIVE
    - MAINTENANCE
    type: string
    x-enum-varnames:
    - EquipmentActive
    - EquipmentMaintenance
  inventory.CreateItemCategoryReq:
    properties:
      categoryName:
        type: string
      parentID:
        type: string
    required:
    - categoryName
    type: object
  inventory.CreateItemReq:
    properties:
      categories:
        items:
          type: string
        type: array
      dataSheetURL:
        type: string
      description:
        type: string
      distributorPart:
        type: string
      distributorURL:
        type: string
      itemName:
        type: string
      logDescription:
        type: string
      manufacturer:
        type: string
      manufacturerPart:
        type: string
      quantity:
        type: integer
    required:
    - itemName
    - manufacturer
    - manufacturerPart
    - quantity
    type: object
  inventory.MoveCategoryReq:
    properties:
      parentID:
        format: uuid
        type: string
        x-nullable: true
    required:
    - parentID
    type: object
  inventory.UpdateItemReq:
    properties:
      categories:
        items:
          type: string
        type: array
      dataSheetURL:
        type: string
      distributorPart:
        type: string
      distributorURL:
        type: string
      itemDescription:
        type: string
      itemName:
        type: string
      logDescription:
        type: string
      manufacturer:
        type: string
      manufacturerPart:
        type: string
      quantity:
        type: integer
    type: object
  settings.CreateSettingRequest:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  settings.PatchSettingsRequest:
    additionalProperties:
      type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: API backend for managing the Unnamed Inventory Manager, a tool for
    handling inventory
  title: Unnamed Inventory Manager API
  version: "1.0"
paths:
  /bookings:
    get:
      description: Get current and upcoming bookings for all equipment, plus bookings
        that ended in the last 24 hours. Mine is true for the logged-in user's bookings
      produces:
      - application/json
      responses:
        "200":
          description: Bookings
          schema:
            properties:
              bookings:
                items:
                  $ref: '#/definitions/bookings.BookingDTO'
                type: array
            type: object
        "401":
          description: Not logged in
        "500":
          description: Error retrieving bookings
      summary: Get bookings
      tags:
      - Booking
    post:
      consumes:
      - application/json
      description: Books equipment for the logged-in user. The slot must be in the
        future, within the next 7 days and the equipment's working hours, at most
        8 hours (including back-to-back bookings by the same user), and must not overlap
        another booking
      parameters:
      - description: Equipment, start and end time (RFC 3339) and purpose
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.BookingReq'
      produces:
      - application/json
      responses:
        "201":
          description: Booking created
          schema:
            properties:
              booking:
                $ref: '#/definitions/bookings.BookingDTO'
            type: object
        "400":
          description: Invalid request body, or the slot breaks a booking rule
        "401":
          description: Not logged in
        "404":
          description: Equipment not found
        "409":
          description: The slot overlaps an existing booking
        "500":
          description: Error creating booking
      summary: Book equipment
      tags:
      - Booking
  /bookings/{id}:
    delete:
      description: Cancels a booking. Allowed for the booking's owner or users with
        BookingManage
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Booking cancelled
        "400":
          description: Invalid booking ID
        "401":
          description: Not logged in
        "403":
          description: Not the owner and missing BookingManage
        "404":
          description: Booking not found
        "500":
          description: Error cancelling booking
      summary: Cancel booking
      tags:
      - Booking
    put:
      consumes:
      - application/json
      description: Changes a booking's equipment, time or purpose. Allowed for the
        booking's owner or users with BookingManage. The booking keeps its owner and
        follows the same rules as a new booking
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Equipment, start and end time (RFC 3339) and purpose
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.BookingReq'
      produces:
      - application/json
      responses:
        "200":
          description: Booking updated
          schema:
            properties:
              booking:
                $ref: '#/definitions/bookings.BookingDTO'
            type: object
        "400":
          description: Invalid booking ID or request body, or the slot breaks a booking
            rule
        "401":
          description: Not logged in
        "403":
          description: Not the owner and missing BookingManage
        "404":
          description: Booking or equipment not found
        "409":
          description: The slot overlaps an existing booking
        "500":
          description: Error updating booking
      summary: Update booking
      tags:
      - Booking
  /callback:
    get:
      description: |-
        Checks the oauth_state cookie, verifies the Google identity and email, starts a session and sends you back to the frontend.
        New users follow signup_policy: open enables them, whitelist enables exact whitelisted email domain matches, and closed creates them disabled for approval.
        A matching non-empty ADMIN_EMAIL bypasses signup restrictions for new users. Existing users keep their disabled status
      parameters:
      - description: OAuth state from Google
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code from Google
        in: query
        name: code
        required: true
        type: string
      responses:
        "303":
          description: Redirect to the frontend
          headers:
            Location:
              description: Frontend URL
              type: string
            Set-Cookie:
              description: Session cookie, valid for 8 hours
              type: string
        "400":
          description: Missing code or invalid OAuth state
        "401":
          description: Invalid Google login or unverified email
        "409":
          description: User details already in use
        "500":
          description: Error logging in or invalid signup settings
      summary: Finish logging in with Google
      tags:
      - Auth
  /categories:
    get:
      consumes:
      - application/json
      description: Gets information for all categories
      responses:
        "200":
          description: Category information retrieved
        "500":
          description: Error retrieving categories
      summary: Get all Categories
      tags:
      - Category
    post:
      consumes:
      - application/json
      description: Adds a category for items. Requires CreateTag or Administrator.
      parameters:
      - description: Category information (categoryName, parentID)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/inventory.CreateItemCategoryReq'
      responses:
        "201":
          description: Item category created
        "400":
          description: Invalid request body
        "401":
          description: Not logged in
        "403":
          description: Permission denied or invalid frontend Origin or Referer
        "500":
          description: Error creating category
      summary: Add item category
      tags:
      - Category
  /categories/{id}:
    delete:
      description: Removes the category from all items and moves its direct children
        to its parent, or to the top level if it has no parent. Requires DeleteTag
        or Administrator.
      parameters:
      - description: Item Category ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Category deleted
        "400":
          description: Invalid category ID
        "401":
          description: Not logged in
        "403":
          description: Permission denied or invalid frontend Origin or Referer
        "404":
          description: Category not found
        "500":
          description: Error deleting category
      summary: Delete an item category
      tags:
      - Category
    get:
      consumes:
      - application/json
      description: Gets information for one category
      parameters:
      - description: Item Category ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Category retrieved
        "400":
          description: Invalid category ID
        "404":
          description: Category not found
        "500":
          description: Error retrieving item category
      summary: Get category
      tags:
      - Category
    patch:
      consumes:
      - application/json
      description: Set the parent of a category, or send null to make it a top-level
        category. Requires CreateTag or Administrator.
      parameters:
      - description: Item Category ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: New parent category ID or null
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/inventory.MoveCategoryReq'
      responses:
        "204":
          description: Category moved
        "400":
          description: Invalid ID, invalid request body or circular category hierarchy
        "401":
          description: Not logged in
        "403":
          description: Permission denied or invalid frontend Origin or Referer
        "404":
          description: Category or parent category not found
        "500":
          description: Error moving category
      summary: Move an item category
      tags:
      - Category
  /equipment:
    get:
      description: Get all bookable equipment
      produces:
      - application/json
      responses:
        "200":
          description: Bookable equipment
          schema:
            properties:
              equipment:
                items:
                  $ref: '#/definitions/bookings.Equipment'
                type: array
            type: object
        "401":
          description: Not logged in
        "500":
          description: Error retrieving equipment
      summary: Get equipment
      tags:
      - Booking
    post:
      consumes:
      - application/json
      description: Adds bookable equipment. Requires BookingAdd
      parameters:
      - description: Equipment details. Missing hours use the category default
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.EquipmentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Equipment created
          schema:
            properties:
              equipment:
                $ref: '#/definitions/bookings.Equipment'
            type: object
        "400":
          description: Invalid request body
        "403":
          description: Missing BookingAdd permission
        "500":
          description: Error creating equipment
      summary: Add equipment
      tags:
      - Booking
  /equipment/{id}:
    delete:
      description: Deletes bookable equipment and all of its bookings. Requires BookingDelete
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Equipment deleted
        "400":
          description: Invalid equipment ID
        "403":
          description: Missing BookingDelete permission
        "404":
          description: Equipment not found
        "500":
          description: Error deleting equipment
      summary: Delete equipment
      tags:
      - Booking
    put:
      consumes:
      - application/json
      description: Replaces bookable equipment details. Requires BookingModify. Existing
        bookings are kept
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Equipment details. Missing hours use the category default
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.EquipmentReq'
      produces:
      - application/json
      responses:
        "200":
          description: Equipment updated
          schema:
            properties:
              equipment:
                $ref: '#/definitions/bookings.Equipment'
            type: object
        "400":
          description: Invalid equipment ID or request body
        "403":
          description: Missing BookingModify permission
        "404":
          description: Equipment not found
        "500":
          description: Error updating equipment
      summary: Update equipment
      tags:
      - Booking
  /items:
    get:
      consumes:
      - application/json
      description: Gets information for all items, including their categories
      responses:
        "200":
          description: Item information retrieved
        "500":
          description: Error retrieving items
      summary: Get all Items
      tags:
      - Item
    post:
      consumes:
      - application/json
      description: Adds item to inventory
      parameters:
      - description: Item information (name, quantity, manufacturer, etc.)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/inventory.CreateItemReq'
      responses:
        "201":
          description: Item created
        "400":
          description: Invalid request body
        "500":
          description: Error creating item or log
      summary: Add item
      tags:
      - Item
  /items/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an item and logs the deletion
      parameters:
      - description: Item ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Item deleted
        "400":
          description: Invalid item ID
        "404":
          description: Item not found
        "500":
          description: Error retrieving or deleting item or creating log
      summary: Delete an item
      tags:
      - Item
    get:
      consumes:
      - application/json
      description: Gets full information for one item, including its categories
      parameters:
      - description: Item ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Item retrieved
        "400":
          description: Invalid item ID
        "404":
          description: Item not found
        "500":
          description: Error retrieving item
      summary: Get item
      tags:
      - Item
    put:
      consumes:
      - application/json
      description: Update item information and return its categories. Send category
        IDs to replace the current categories, or an empty list to clear them.
      parameters:
      - description: Item ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Item information to be updated (name, quantity, manufacturer,
          etc.). Only changed files are necessary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/inventory.UpdateItemReq'
      responses:
        "200":
          description: Item updated (returns object)
        "400":
          description: Invalid item id, invalid request body, empty request body
        "404":
          description: Item not found, failure to update item or create log, fail
            to retrieve modified item
        "500":
          description: 'Failed to retrieve item, '
      summary: Update item
      tags:
      - Item
  /login:
    get:
      description: Saves the login state in a cookie and sends you to Google
      responses:
        "302":
          description: Redirect to Google
          headers:
            Location:
              description: Google login URL
              type: string
            Set-Cookie:
              description: OAuth state cookie, valid for 10 minutes
              type: string
        "500":
          description: Error checking session
      summary: Log in with Google
      tags:
      - Auth
  /logout:
    post:
      description: Deletes your session and clears the session cookie. Available to
        logged-in users, including disabled users
      parameters:
      - description: Frontend origin, required if Referer is not set
        in: header
        name: Origin
        type: string
      responses:
        "200":
          description: Logged out
          headers:
            Set-Cookie:
              description: Clears the session cookie
              type: string
        "400":
          description: Missing session cookie
        "401":
          description: Not logged in
        "403":
          description: Invalid or missing frontend Origin or Referer
        "500":
          description: Error logging out
      summary: Log out
      tags:
      - Auth
  /logs:
    get:
      consumes:
      - application/json
      description: Gets all logs saved from changes to the inventory
      responses:
        "200":
          description: Log information retrieved
        "500":
          description: Error retrieving logs
      summary: Get changelog
      tags:
      - Item
  /permissions:
    get:
      description: Uses the session cookie to get your permissions. Must be logged
        in
      produces:
      - application/json
      responses:
        "200":
          description: Current user's permissions
          schema:
            items:
              type: string
            type: array
        "401":
          description: Not logged in
        "500":
          description: Error getting permissions
      summary: Get your permissions
      tags:
      - Auth
  /permissions/{id}:
    get:
      description: Get permissions by user ID. Admin only, using the session cookie
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User's permissions
          schema:
            items:
              type: string
            type: array
        "400":
          description: Invalid user ID
        "401":
          description: Not logged in
        "403":
          description: Not an administrator
        "404":
          description: User not found
        "500":
          description: Error getting permissions
      summary: Get a user's permissions
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Replace the user's permissions, or send an empty list to clear
        them. Admin only, using the session cookie. Administrators cannot remove their
        own Administrator permission.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.PutPermissionsRequest'
      - description: Frontend origin, required if Referer is not set
        in: header
        name: Origin
        type: string
      responses:
        "204":
          description: Permissions updated
        "400":
          description: Invalid user ID or request body
        "401":
          description: Not logged in
        "403":
          description: Not an administrator, removing own Administrator permission,
            or invalid frontend Origin or Referer
        "404":
          description: User not found
        "500":
          description: Error updating permissions
      summary: Replace a user's permissions
      tags:
      - Auth
  /settings:
    get:
      description: Get all setting names and their string values. Lists are stored
        as JSON-encoded strings. Admin only, using the session cookie
      produces:
      - application/json
      responses:
        "200":
          description: Application settings
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
        "403":
          description: Not an administrator or user disabled
        "500":
          description: Error getting settings
      summary: Get settings
      tags:
      - Settings
    patch:
      consumes:
      - application/json
      description: |-
        Update existing settings by name. Values must be strings; encode lists as JSON strings. Omitted settings are unchanged.
        All updates are applied together, and unknown names are rejected. Admin only, using the session cookie
      parameters:
      - description: Setting names mapped to string values
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/settings.PatchSettingsRequest'
      - description: Frontend origin, required if Referer is not set
        in: header
        name: Origin
        type: string
      responses:
        "204":
          description: Settings updated
        "400":
          description: Invalid request body, non-string value, or no settings provided
        "401":
          description: Not logged in
        "403":
          description: Not an administrator, user disabled, or invalid frontend Origin
            or Referer
        "404":
          description: Setting not found
        "500":
          description: Error updating settings
      summary: Update settings
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Create a new named setting with a string value. Existing names
        are rejected. Admin only, using the session cookie
      parameters:
      - description: New setting name and string value
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/settings.CreateSettingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Setting created
          schema:
            properties:
              name:
                type: string
              value:
                type: string
            type: object
        "400":
          description: Invalid request body, empty name, or missing string value
        "401":
          description: Not logged in
        "403":
          description: Not an administrator, user disabled, or invalid frontend Origin
            or Referer
        "409":
          description: Setting already exists
        "500":
          description: Error creating setting
      summary: Create a setting
      tags:
      - Settings
  /user/{id}:
    get:
      description: Get a user's ID, name, email, disabled status and permissions.
        Admin only, using the session cookie
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            properties:
              disabled:
                type: boolean
              email:
                type: string
              id:
                type: string
              name:
                type: string
              permissions:
                items:
                  type: string
                type: array
            type: object
        "400":
          description: Invalid user ID
        "401":
          description: Not logged in
        "403":
          description: Not an administrator or user disabled
        "404":
          description: User not found
        "500":
          description: Error getting user
      summary: Get a user
      tags:
      - Auth
  /users:
    get:
      description: Get each user's ID, name, email, disabled status and permissions,
        ordered by email. Admin only, using the session cookie
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            items:
              properties:
                disabled:
                  type: boolean
                email:
                  type: string
                id:
                  type: string
                name:
                  type: string
                permissions:
                  items:
                    type: string
                  type: array
              type: object
            type: array
        "401":
          description: Not logged in
        "403":
          description: Not an administrator or user disabled
        "500":
          description: Error getting users
      summary: Get all users
      tags:
      - Auth
  /users/{id}:
    patch:
      consumes:
      - application/json
      description: Disable or enable a user. Admin only, using the session cookie
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Whether the user is disabled
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.PatchUserRequest'
      - description: Frontend origin, required if Referer is not set
        in: header
        name: Origin
        type: string
      responses:
        "204":
          description: User updated
        "400":
          description: Invalid user ID or request body
        "401":
          description: Not logged in
        "403":
          description: Not an administrator or invalid frontend Origin or Referer
        "404":
          description: User not found
        "500":
          description: Error updating user
      summary: Update a user
      tags:
      - Auth
  /whoami:
    get:
      description: Returns login status and disabled status. Enabled users also receive
        their name, email and permissions
      produces:
      - application/json
      responses:
        "200":
          description: Login status and user details
          schema:
            properties:
              disabled:
                type: boolean
              email:
                type: string
              loggedIn:
                type: boolean
              name:
                type: string
              permissions:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Error getting current user
